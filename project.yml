# XcodeGen tanımı: "xcodegen generate" komutu FramePOC.xcodeproj üretir.
# Mac'e ihtiyaç duymadan (Codemagic build sunucusunda) proje oluşturmak için.
name: FramePOC
options:
  bundleIdPrefix: com.framepoc
  deploymentTarget:
    iOS: "16.0"
targets:
  FramePOC:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.framepoc.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
